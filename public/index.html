<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniZhi</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--fg);
      --bg: #f7f7f8; --fg: #1a1a1a; --card: #ffffff; --muted: #8a8a8a; --line: #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      body { --bg: #121212; --fg: #e8e8e8; --card: #1d1d1f; --muted: #9a9a9a; --line: #303034; }
    }
    main { max-width: 560px; margin: 6vh auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
    textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    button { margin-top: 8px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
    .status { color: var(--muted); font-size: 13px; margin: 4px 0; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
    @media (prefers-color-scheme: dark) { .ok { color: #81c784; } .err { color: #ef9a9a; } }
  </style>
</head>
<body>
<main>
  <h1>MiniZhi</h1>
  <div class="card">
    <div class="status">会话状态：<span id="state">读取中…</span></div>
    <div class="status">登录人：<span id="who">-</span></div>
  </div>
  <div class="card">
    <p class="status">第一步（一次性）：登录 zhihu.com 后，按 F12 → Network → 点任意
    <code>www.zhihu.com/api/...</code> 请求 → Request Headers → 复制整行
    <code>Cookie:</code> 的值，粘贴到下面：</p>
    <textarea id="cookie" placeholder="粘贴完整 Cookie 头字符串"></textarea>
    <div><button id="save">保存并校验登录</button>
    <button id="probe" style="display:none">诊断签名口径</button>
    <button id="clear">清除会话</button></div>
    <div id="msg"></div>
  </div>
  <p class="status">这是临时登录页；阅读界面（推荐/热榜/问题页）正在开发。</p>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  async function j(url, opt) {
    const r = await fetch(url, opt)
    const data = await r.json().catch(() => ({}))
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`)
    return data
  }
  function say(text, cls) {
    $('msg').textContent = text
    $('msg').className = cls || ''
  }
  async function refresh() {
    try {
      const s = await j('/api/session')
      $('state').textContent = s.hasCookie ? `已保存（签名口径 ${s.signMode}）` : '未登录（未粘贴 cookie）'
      if (s.hasCookie) {
        const me = await j('/api/me')
        $('who').textContent = me.name || me.urlToken || '未知'
        $('probe').style.display = ''
      } else {
        $('who').textContent = '-'
        $('probe').style.display = 'none'
      }
    } catch (e) {
      $('state').textContent = '未登录（未粘贴 cookie）'
      $('who').textContent = '-'
      say(e.message, 'err')
    }
  }
  $('save').onclick = async () => {
    const cookie = $('cookie').value.trim()
    if (!cookie) return say('请先粘贴 cookie', 'err')
    say('正在保存并校验…')
    try {
      await j('/api/session', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cookie }) })
      const me = await j('/api/me')
      say(`校验通过：你好，${me.name || me.urlToken}`, 'ok')
      await refresh()
    } catch (e) {
      say(e.message, 'err')
    }
  }
  $('probe').onclick = async () => {
    say('正在实测两种签名口径（full=含 query / path=纯路径）…')
    try {
      const r = await j('/api/probe/me')
      const line = (m) => `${m}: ${r[m].ok ? `OK（${r[m].name ?? ''}）` : `HTTP ${r[m].status} ${r[m].detail}`}`
      say(`full ${line('full')}；path ${line('path')}`, '')
    } catch (e) { say(e.message, 'err') }
  }
  $('clear').onclick = async () => {
    await j('/api/session', { method: 'DELETE' })
    say('已清除', '')
    await refresh()
  }
  refresh()
</script>
</body>
</html>
