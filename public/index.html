<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MiniZhi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#recommend">MiniZhi</a>
      <nav class="tabs">
        <a href="#recommend" data-tab="recommend">推荐</a>
        <a href="#hot" data-tab="hot">热榜</a>
      </nav>
      <div class="topbar-right">
        <button id="btnRefresh" class="ghost" title="刷新当前列表">刷新</button>
        <span id="who" class="who" title="点击设置登录"></span>
      </div>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main id="view" class="view"></main>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>登录设置</h2>
      <p class="hint">在 zhihu.com 登录后：F12 → Network → 任意 <code>api</code> 请求 →
        Request Headers → 复制整行 <code>Cookie:</code> 的值粘贴到下面：</p>
      <textarea id="cookieInput" placeholder="粘贴完整 Cookie 头字符串"></textarea>
      <div class="row">
        <button value="cancel">取消</button>
        <button type="button" class="primary" id="cookieSave">保存并校验</button>
      </div>
      <p id="settingsMsg" class="hint"></p>
    </form>
  </dialog>

  <dialog id="comments">
    <div class="comments-head">
      <h2>评论</h2>
      <button id="commentsClose" class="ghost">关闭</button>
    </div>
    <div id="commentsBody" class="comments-body"></div>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
