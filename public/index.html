<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MiniZhi</title>
  <link rel="stylesheet" href="style.css">
  <!-- Tailwind v4 运行时（本地 vendor，离线可用，零构建） -->
  <script src="vendor/tailwind.browser.js"></script>
</head>
<body class="min-h-screen">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand select-none" href="#recommend">MiniZhi</a>
      <nav class="tabs">
        <a href="#recommend" data-tab="recommend" class="select-none">推荐</a>
        <a href="#hot" data-tab="hot" class="select-none">热榜</a>
      </nav>
      <div class="topbar-right">
        <button id="btnRefresh" class="btn btn-ghost btn-sm" title="刷新当前列表">↻ 刷新</button>
        <button id="who" class="who" type="button" title="设置登录 / 查看屏蔽" aria-label="账号与设置">…</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

  <main id="view" class="view"></main>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>登录设置</h2>
      <p class="hint leading-relaxed">在 zhihu.com 登录后：F12 → Network → 任意 <code>api</code> 请求 →
        Request Headers → 复制整行 <code>Cookie:</code> 的值粘贴到下面：</p>
      <textarea id="cookieInput" placeholder="粘贴完整 Cookie 头字符串"></textarea>
      <div class="row justify-end">
        <button value="cancel" class="btn">取消</button>
        <button type="button" class="btn btn-primary" id="cookieSave">保存并校验</button>
      </div>
      <p id="settingsMsg" class="hint mt-2"></p>
      <p class="hint">快捷键：<code>←</code>/<code>→</code> 或 <code>Shift+P</code>/<code>Shift+N</code> 切换上一条 / 下一条</p>
      <div class="row justify-end border-t mt-4 pt-3" style="border-top:1px solid var(--line)">
        <span id="discardInfo" class="hint"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="discardClear">取消本次隐藏</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
